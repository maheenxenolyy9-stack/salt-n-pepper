  <body>

      <nav class="navbar">
        <a href="#" class="logo">
          <img src="logo.webp" alt="Salt n Pepper logo">
        </a>

        <div class="nav-items">
          <a href="#">Home</a>
          <a href="#about">About Us</a>
          <a href="#publication">Publication</a>
          <button class="franchise-btn">Get a Franchise</button>

        </div>

        <div class="brand-parent">
          <div class="brand-card">
            <div class="brand-box">
              <img src="restaurant.webp" alt="restaurant logo image">
            </div>
            <a href="#" class="outline-btn">Order Now</a>
          </div>

          <div class="brand-card">
            <div class="brand-box">
              <img src="express.webp" alt="Express">
            </div>
            <a href="#" class="outline-btn">Order Now</a>
          </div>

          <div class="brand-card">
            <div class="brand-box">
              <img src="green village logo.webp" alt="village">
            </div>
            <a href="#" class="ouline-btn">Order Now</a>
          </div>

          <div class="brand-card">
            <div class="brand-box">
              <img src="signature.webp" alt="Brand">
            </div>
            <a href="#" class="ouline-btn">Order Now</a>
          </div>
