<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt'n Pepper Restaurants</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&family=Figtree:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<header class="header" id="home">
    <nav class="navbar">
        <a href="#home" class="logo">
            <img src="logo.webp" alt="Salt'n Pepper Logo">
        </a>

        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span><span></span><span></span>
        </label>

        <div class="nav-items">
            <a href="#home">Home</a>
            <a href="#franchise">About Us</a>
            <a href="#publications">Publications</a>
            <a href="#contact" class="outline-btn">Get a Franchise</a>
            <a href="#brands" class="red-btn">Order Online →</a>
        </div>
    </nav>
</header>

<!-- ===== HERO SLIDER ===== -->
 <section class="slider" id="slider">
    <div class="slides">
        <img class="slide active"
        src="order now.webp" alt="Free Delivery">
        <img class="slide" src="khana.webp" alt="Dinner Buffet">
        <img class="slide" src="village.webp" alt="Hi-Tea Buffet">
        <img class="slide" src="B.B.B.webp" alt="Breakfast Buffet">
    </div>

    <button class="arrow arrow--prev" aria-label="Previous">&#10094;</button>
    <button class="arrow arrow--next" aria-label="Next">&#10095;</button>

    <div class="dots"></div>
 </section>

 <!-- ===== OUR BRANDS ===== -->
  <section class="ob">
    <h2 class="ob-title">
        Welcome to <span class="ob-name">Salt'n Pepper</span><br>Restaurants! Our Brands
    </h2>
    <p class="ob-sub">Please click our brands below for further information, reservations or to order online! </p>

    <div class="ob-row">
        <div class="ob-card">
            <a href="#" class="ob-img"><img src="restaurant.webp" alt="Salt'n Pepper Restaurant"></a>
            <a href="#" class="ob-btn">Order Now</a>
        </div>
        <div class="ob-card">
            <a href="#" class="ob-img"><img src="express.webp" alt="Salt'n Pepper Express"></a>
            <a href="#" class="ob-btn">Order Now</a>
        </div>
        <div class="ob-card">
            <a href="#" class="ob-img"><img src="green village logo.webp" alt="Salt'n Pepper Village"></a>
            <a href="#" class="ob-btn">Order Now</a>
        </div>
        <div class="ob-card">
            <a href="#" class="ob-img"><img src="signature.webp" alt="Salt'n Pepper Signature"></a>
              <a href="#" class="ob-btn">Order Now</a>
        </div>
    </div>
  </section>
 <script src="script .js"></script>
 <script src="https://kit.fontawesome.com/9aded8b196.js" crossorigin="anonymous"></script>
 </body>
 </html>
