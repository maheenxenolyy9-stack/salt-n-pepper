<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt'n Pepper Restaurants</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<header class="header" id="home">
    <nav class="navbar">
        <a href="#home" class="logo">
            <img src="logo.webp" alt="Salt'n Pepper Logo">
        </a>

        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="menu-icon">
            <span></span><span></span><span></span>
        </label>

        <div class="nav-items">
            <a href="#home">Home</a>
            <a href="#franchise">About Us</a>
            <a href="#publications">Publications</a>
            <a href="#contact" class="outline-btn">Get a Franchise</a>
            <a href="#brands" class="red-btn">Order Online →</a>
        </div>
    </nav>
</header>

<!-- ===== HERO SLIDER ===== -->
 <section class="slider" id="slider">
    <div class="slides">
        <img class="slide active"
        src="order now.webp" alt="Free Delivery">
        <img class="slide" src="khana.webp" alt="Dinner Buffet">
        <img class="slide" src="village.webp" alt="Hi-Tea Buffet">
        <img class="slide" src="B.B.B.webp" alt="Breakfast Buffet">
    </div>

    <button class="arrow arrow--prev" aria-label="Previous">&#10094;</button>
    <button class="arrow arrow--next" aria-label="Next">&#10095;</button>

    <div class="dots"></div>
 </section>

 <!-- ===== OUR BRANDS ===== -->
  <section class="our-brand">
            <!-- our brands started -->
            <h1>Welcome to <span class="futurak-font">Salt'n Pepper</span> <br />
                Restaurants! Our Brands</h1>

            <p>Please click our brands below for further information, reservations or to order online!</p>
            <!-- our brands ended -->


            <div class="brand-cards">
                <div class="card">
                    <img class="brand-card-image" src="restaurant.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
                <div class="card">
                    <img class="brand-card-image" src="expresss.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
                <div class="card">
                    <img class="brand-card-image" src="green village logo.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
                <div class="card">
                    <img class="brand-card-image" src="signature.webp" alt="brand-card">
                    <button class="brand-order-btn">Order Now</button>
                </div>
            </div>
        </section>
 <script src="script .js"></script>
 
 </body>
 </html>
